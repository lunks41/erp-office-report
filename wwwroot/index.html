<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Telerik HTML5 Report Viewer Demo</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <style>
        body {
            font-family: Verdana, Arial, sans-serif;
            margin: 5px;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <div id="content">
        loading...
    </div>

    <script type="text/javascript">

        $(document).ready(function () {
            // Use /version for the health check. /formats requires JWT ([Authorize]),
            // so an unauthenticated GET falsely reported "NOT running".
            const url = '/api/reports/version';

            $.getJSON(url, function (version) {
                const label = version ? (" v" + version) : "";
                $("#content").text("Telerik Reporting REST Service is up and running" + label + ".");
            })
                .fail(function (data) {
                    // 401 on other endpoints means the host is up but auth is required.
                    if (data && data.status === 401) {
                        $("#content").text("Telerik Reporting REST Service is up and running (authentication required).");
                        return;
                    }
                    $("#content").html("Telerik Reporting REST Service is NOT running: <br />" + (data.responseText || data.statusText || "request failed"));
                });
        });
    </script>
</body>
</html>
